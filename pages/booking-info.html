<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>예약 정보 입력 - 회의실 예약</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script type="module" src="../src/pages/booking-info.js"></script>
  </head>
  <body class="booking-body">
    <div class="booking-app-shell">
      <header class="booking-app-bar">
        <a href="booking-date-time.html" data-back-link aria-label="날짜와 시간 선택으로 돌아가기">‹</a>
        <h1>회의실 예약</h1>
        <span></span>
      </header>
      <main class="booking-page">
        <p class="booking-step">2/3</p>
        <h2 tabindex="-1">예약 정보를 입력해 주세요</h2>
        <section class="selected-room-summary" data-room-summary aria-live="polite"></section>
        <p class="booking-content-state is-error" data-room-error hidden aria-live="polite"></p>

        <form class="booking-info-form" novalidate>
          <div class="booking-field booking-readonly-field">
            <span>예약자</span>
            <strong data-reserver-name></strong>
            <p>예약자는 참석 인원에 자동으로 포함되지 않아요.</p>
          </div>
          <div class="booking-field">
            <label for="booking-topic">회의 주제 <span>필수</span></label>
            <input id="booking-topic" name="topic" maxlength="100" placeholder="회의 주제를 입력해 주세요" required>
            <p class="booking-field-error" id="topic-error" aria-live="polite"></p>
          </div>

          <div class="booking-field attendee-field" data-attendee-field>
            <div class="booking-field-heading">
              <label for="attendee-input">참석자 <span>필수</span></label>
              <strong data-attendee-count>0명</strong>
            </div>
            <div class="attendee-input-box" data-attendee-box>
              <div class="attendee-chips" data-attendee-chips></div>
              <input
                id="attendee-input"
                placeholder="이름을 입력하고 쉼표(,)를 눌러 주세요"
                aria-describedby="attendee-guide attendee-error"
              >
            </div>
            <p class="booking-field-guide" id="attendee-guide">이름 뒤에 쉼표를 입력하면 참석자로 추가돼요. 예약자 본인이 참석하는 경우 본인 이름도 입력해 주세요.</p>
            <p class="booking-field-error" id="attendee-error" aria-live="polite"></p>
          </div>

          <div class="booking-field">
            <label for="additional-info">추가 정보 <span>선택</span></label>
            <textarea id="additional-info" name="additionalInfo" maxlength="500" placeholder="필요한 설비나 요청사항을 입력해 주세요"></textarea>
          </div>
        </form>
      </main>
      <footer class="booking-footer">
        <button class="booking-primary-button" type="button" data-next-button aria-disabled="true">다음</button>
        <nav class="booking-bottom-nav" aria-label="주요 메뉴">
          <a class="is-current" href="rooms.html" aria-current="page">회의실</a>
          <a href="reservations.html">내 예약</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
