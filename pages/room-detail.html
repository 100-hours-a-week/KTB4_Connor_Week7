<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>회의실 상세 - 회의실 예약</title>
    <link rel="stylesheet" href="../styles/main.css?v=7">
    <script type="module" src="../src/pages/room-detail.js?v=4"></script>
  </head>
  <body class="booking-body">
    <div class="booking-app-shell room-detail-shell">
      <header class="booking-app-bar room-detail-app-bar">
        <a href="rooms.html" aria-label="회의실 목록으로 돌아가기" data-rooms-link>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m13 4-4 8 4 8"/>
          </svg>
        </a>
        <h1>회의실 상세</h1>
        <span></span>
      </header>
      <main class="booking-page room-detail-page">
        <div class="booking-content-state" data-room-state aria-live="polite">회의실 정보를 불러오는 중이에요.</div>
        <article class="room-detail" data-room-detail hidden>
          <div class="room-detail-image" data-room-image></div>
          <header>
            <h2 tabindex="-1" data-room-name></h2>
            <p data-room-location></p>
          </header>
          <section aria-labelledby="room-summary-heading">
            <h3 id="room-summary-heading">공간 정보</h3>
            <p data-room-description></p>
            <p data-room-capacity></p>
          </section>
          <section aria-labelledby="room-facilities-heading">
            <h3 id="room-facilities-heading">설비</h3>
            <ul class="facility-list" data-room-facilities></ul>
          </section>
          <section aria-labelledby="room-hours-heading">
            <h3 id="room-hours-heading">운영 시간</h3>
            <p data-room-hours></p>
            <p data-room-policy></p>
          </section>
          <section aria-labelledby="room-guide-heading">
            <h3 id="room-guide-heading">이용 안내</h3>
            <p data-room-guide></p>
          </section>
        </article>
      </main>
      <footer class="booking-footer">
        <button class="booking-primary-button" type="button" data-book-button disabled>예약하기</button>
      </footer>
    </div>
  </body>
</html>
