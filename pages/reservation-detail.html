<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>예약 상세 - 회의실 예약</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script type="module" src="../src/pages/reservation-detail.js"></script>
  </head>
  <body class="booking-body">
    <div class="booking-app-shell">
      <header class="booking-app-bar">
        <a href="reservations.html" aria-label="내 예약 목록으로 돌아가기">‹</a>
        <h1>예약 상세</h1>
        <span></span>
      </header>
      <main class="booking-page reservation-detail-page">
        <div class="booking-content-state" data-reservation-state aria-live="polite">예약 정보를 불러오는 중이에요.</div>
        <article class="reservation-detail" data-reservation-detail hidden>
          <p class="reservation-status-badge" data-reservation-status></p>
          <h2 tabindex="-1" data-reservation-topic></h2>
          <dl class="reservation-detail-list" data-reservation-summary></dl>
          <section class="reservation-admin-reason" data-admin-reason hidden>
            <h3>관리자 취소 사유</h3>
            <p></p>
          </section>
          <p class="booking-inline-feedback is-error" data-reservation-feedback aria-live="assertive" hidden></p>
          <div class="reservation-detail-actions" data-reservation-actions hidden>
            <button class="booking-secondary-button" type="button" data-change-reservation>예약 변경</button>
            <button class="reservation-cancel-button" type="button" data-cancel-reservation>예약 취소</button>
          </div>
        </article>
      </main>
      <footer class="booking-footer booking-footer-navigation-only">
        <nav class="booking-bottom-nav" aria-label="주요 메뉴">
          <a href="rooms.html">회의실</a>
          <a class="is-current" href="reservations.html" aria-current="page">내 예약</a>
        </nav>
      </footer>
    </div>

    <div class="booking-dialog-backdrop" data-cancel-dialog hidden>
      <section class="booking-dialog" role="dialog" aria-modal="true" aria-labelledby="cancel-dialog-title" aria-describedby="cancel-dialog-description">
        <h2 id="cancel-dialog-title">예약을 취소할까요?</h2>
        <p id="cancel-dialog-description"></p>
        <div class="booking-dialog-actions">
          <button type="button" data-dialog-cancel>돌아가기</button>
          <button type="button" data-dialog-confirm>예약 취소</button>
        </div>
      </section>
    </div>
  </body>
</html>
