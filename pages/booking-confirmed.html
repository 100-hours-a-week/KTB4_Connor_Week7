<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>예약 완료 - 회의실 예약</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script type="module" src="../src/pages/booking-confirmed.js"></script>
  </head>
  <body class="booking-body">
    <div class="booking-app-shell">
      <header class="booking-app-bar">
        <h1>회의실 예약</h1>
        <span></span>
      </header>
      <main class="booking-page booking-confirmed-page">
        <div class="booking-success-icon" aria-hidden="true">✓</div>
        <p class="booking-status-badge">예약 확정</p>
        <h2 tabindex="-1">회의실 예약이 완료됐어요</h2>
        <p>관리자 승인 없이 바로 확정됐습니다.</p>
        <p class="reservation-number" data-reservation-number></p>
        <section class="confirmed-summary" data-confirmed-summary aria-live="polite">예약 결과를 불러오는 중이에요.</section>
        <a class="booking-primary-link" href="reservations.html" data-my-reservations>내 예약 보기</a>
        <a class="booking-secondary-button" href="rooms.html" data-new-booking>회의실 목록으로</a>
      </main>
      <footer class="booking-footer booking-footer-navigation-only">
        <nav class="booking-bottom-nav" aria-label="주요 메뉴">
          <a class="is-current" href="rooms.html" aria-current="page">회의실</a>
          <a href="reservations.html">내 예약</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
