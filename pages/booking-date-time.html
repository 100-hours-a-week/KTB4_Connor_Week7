<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>날짜와 시간 선택 - 회의실 예약</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script type="module" src="../src/pages/booking-date-time.js"></script>
  </head>
  <body class="booking-body">
    <div class="booking-app-shell">
      <header class="booking-app-bar">
        <a href="room-detail.html" data-room-detail-link aria-label="회의실 상세로 돌아가기">‹</a>
        <h1>회의실 예약</h1>
        <span></span>
      </header>

      <main class="booking-page booking-date-time-page">
        <p class="booking-step">1/3</p>
        <h2 tabindex="-1">날짜와 시간을 선택해 주세요</h2>

        <section class="selected-booking-room" aria-label="선택한 회의실">
          <div>
            <span>선택한 회의실</span>
            <strong data-selected-room-name></strong>
          </div>
          <button type="button" data-change-room>회의실 변경</button>
        </section>
        <p class="booking-inline-feedback" data-booking-feedback aria-live="assertive" hidden></p>

        <section class="booking-selection-summary" aria-live="polite">
          <span aria-hidden="true">▣</span>
          <div>
            <strong data-schedule-summary>날짜를 선택해 주세요</strong>
            <span data-duration-summary></span>
          </div>
        </section>

        <section class="calendar-section" aria-labelledby="calendar-heading">
          <div class="calendar-heading-row">
            <button type="button" data-previous-month aria-label="이전 달">‹</button>
            <h3 id="calendar-heading" data-calendar-heading></h3>
            <button type="button" data-next-month aria-label="다음 달">›</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="booking-loading" data-calendar-state aria-live="polite">날짜 정보를 불러오는 중이에요.</div>
          <div class="calendar-grid" data-calendar-grid></div>
        </section>

        <section class="timeline-section" aria-labelledby="timeline-heading">
          <div class="timeline-heading-row">
            <div>
              <h3 id="timeline-heading">이용 시간</h3>
              <p>시간을 누르거나 좌우로 드래그해 선택하세요.</p>
            </div>
            <div class="timeline-scroll-buttons">
              <button type="button" data-scroll-left aria-label="이전 시간 보기">‹</button>
              <button type="button" data-scroll-right aria-label="다음 시간 보기">›</button>
            </div>
          </div>
          <div class="timeline-placeholder" data-timeline-state aria-live="polite">날짜를 먼저 선택해 주세요.</div>
          <div class="timeline-scroll" data-timeline hidden></div>
          <p class="booking-helper" data-time-helper aria-live="polite"></p>
        </section>
      </main>

      <footer class="booking-footer">
        <button class="booking-primary-button" type="button" data-next-button disabled>다음</button>
        <nav class="booking-bottom-nav" aria-label="주요 메뉴">
          <a class="is-current" href="rooms.html" aria-current="page">회의실</a>
          <a href="reservations.html">내 예약</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
