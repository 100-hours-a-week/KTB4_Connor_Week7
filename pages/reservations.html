<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>내 예약 - 회의실 예약</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script type="module" src="../src/pages/reservations.js"></script>
  </head>
  <body class="booking-body">
    <div class="booking-app-shell is-navigation-free">
      <header class="booking-app-bar booking-list-app-bar">
        <h1 tabindex="-1">내 예약</h1>
        <a class="booking-header-pill" href="rooms.html">회의실</a>
      </header>
      <main class="booking-page reservations-page">
        <h2 class="visually-hidden">예약 상태별 내역</h2>
        <div class="reservation-filter-list" aria-label="예약 상태 필터">
          <button type="button" data-reservation-filter="UPCOMING" aria-pressed="true">예정</button>
          <button type="button" data-reservation-filter="PAST" aria-pressed="false">완료</button>
          <button type="button" data-reservation-filter="CANCELED" aria-pressed="false">취소</button>
        </div>
        <section class="reservation-summary" aria-live="polite">
          <span data-reservation-summary-label>다가오는 예약</span>
          <strong data-reservation-summary-count>0건</strong>
        </section>
        <div class="booking-content-state" data-reservation-state aria-live="polite"></div>
        <section class="reservation-card-list" data-reservation-list aria-label="내 예약 목록"></section>
        <button class="reservation-load-more" type="button" data-load-more hidden>더 보기</button>
      </main>
    </div>
  </body>
</html>
