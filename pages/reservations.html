<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>내 예약 - 회의실 예약</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script type="module" src="../src/pages/reservations.js"></script>
  </head>
  <body class="booking-body">
    <div class="booking-app-shell">
      <header class="booking-app-bar">
        <h1>회의실 예약</h1>
        <span></span>
      </header>
      <main class="booking-page reservations-page">
        <h2 tabindex="-1">내 예약</h2>
        <p class="booking-page-description">예정된 예약과 지난 이용 내역을 확인할 수 있어요.</p>
        <div class="reservation-filter-list" aria-label="예약 상태 필터">
          <button type="button" data-reservation-filter="UPCOMING" aria-pressed="true">예정</button>
          <button type="button" data-reservation-filter="PAST" aria-pressed="false">지난 예약</button>
          <button type="button" data-reservation-filter="CANCELED" aria-pressed="false">취소</button>
        </div>
        <div class="booking-content-state" data-reservation-state aria-live="polite"></div>
        <section class="reservation-card-list" data-reservation-list aria-label="내 예약 목록"></section>
        <button class="reservation-load-more" type="button" data-load-more hidden>더 보기</button>
      </main>
      <footer class="booking-footer booking-footer-navigation-only">
        <nav class="booking-bottom-nav" aria-label="주요 메뉴">
          <a href="rooms.html">회의실</a>
          <a class="is-current" href="reservations.html" aria-current="page">내 예약</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
